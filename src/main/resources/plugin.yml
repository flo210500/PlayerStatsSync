name: PlayerStatsSync
version: '${project.version}'
main: de.plugin.playerstatssync.PlayerStatsSync
api-version: '1.21'
description: Syncs scoreboard objectives per player with a MySQL database
author: Shin_Jin_Jin

commands:
  playerstatssync:
    description: Main command for PlayerStatsSync
    aliases: [pss]
    permission: playerstatssync.admin
    usage: /pss <reload|sync|status>
  verify:
    description: Link your Minecraft account with the website
    usage: /verify <6-digit code>
    permission: playerstatssync.verify

permissions:
  playerstatssync.admin:
    description: Access to all PlayerStatsSync commands
    default: op
  playerstatssync.verify:
    description: Allows using /verify to link your account
    default: true