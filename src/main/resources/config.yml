# ============================================================
#   ScoreboardSync - Configuration
# ============================================================

# ============================================================
#   Account Verification (/verify command)
#
#   Players type /verify <code> in-game after requesting a
#   6-digit code on the website. This plugin sends a signed
#   HTTP POST to WordPress which then links the accounts.
# ============================================================
verify:
  enabled: true

  # Full URL to the WordPress REST endpoint
  wordpress-url: "https://DEINE-DOMAIN.de/wp-json/msp/v1/verify"

  # Shared secret for HMAC-SHA256 request signing
  # Must be IDENTICAL to MSP_HMAC_SECRET in minecraft-stats-plugin.php
  # Generate with: openssl rand -hex 32
  hmac-secret: "DEIN_GEHEIMES_SECRET_HIER"

  # Shown to players in the /verify usage hint
  website-url: "https://DEINE-DOMAIN.de/stats"

# MySQL database connection settings
database:
  host: "localhost"
  port: 3306
  name: "minecraft"
  username: "root"
  password: "password"
  table-prefix: "sbsync_"

  # HikariCP connection pool settings
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

# ============================================================
#   Scoreboard Objectives to sync
#
#   Format:
#     <objective-name>:
#       enabled: true/false           # Whether to sync this objective
#       display-name: "..."           # Optional: used for logging only
#       sync-on-join: true/false      # Save to DB when player joins
#       sync-on-quit: true/false      # Save to DB when player quits
#       sync-periodically: true/false # Include in periodic sync task
#       conflict-resolution:          # What to do when a value already exists in DB:
#         last-write-wins             #   Always overwrite (default)
#         additive                    #   Keep the higher value (safe for monotonic counters like kills/deaths)
#         max                         #   Keep the higher value (same as additive)
#         min                         #   Keep the lower value
#
# ============================================================
objectives:
  kills:
    enabled: true
    display-name: "Player Kills"
    sync-on-join: true
    sync-on-quit: true
    sync-periodically: true
    conflict-resolution: additive

  deaths:
    enabled: true
    display-name: "Deaths"
    sync-on-join: true
    sync-on-quit: true
    sync-periodically: true
    conflict-resolution: additive

  money:
    enabled: true
    display-name: "Money"
    sync-on-join: true
    sync-on-quit: true
    sync-periodically: true
    conflict-resolution: last-write-wins

  playtime:
    enabled: true
    display-name: "Playtime (minutes)"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true
    conflict-resolution: additive

# ============================================================
#   Sync interval in minutes (default: 20)
# ============================================================
sync-interval-minutes: 20

# ============================================================
#   Logging
# ============================================================
logging:
  log-sync-actions: true
  log-db-connections: false
  log-errors: true

# ============================================================
#   Minecraft Internal Statistics
#
#   Format for UNTYPED stats (no material/entity):
#     <key>:
#       enabled: true
#       statistic: DEATHS            # Bukkit Statistic enum name
#       display-name: "Deaths"
#       sync-on-join: true
#       sync-on-quit: true
#       sync-periodically: true
#
#   Format for BLOCK/ITEM stats (per material):
#     <key>:
#       enabled: true
#       statistic: MINE_BLOCK
#       display-name: "Blocks Mined"
#       materials:
#         - DIAMOND_ORE
#         - DEEPSLATE_DIAMOND_ORE
#         - IRON_ORE
#       sync-on-join: false
#       sync-on-quit: true
#       sync-periodically: true
#
#   Format for ENTITY stats (per entity type):
#     <key>:
#       enabled: true
#       statistic: KILL_ENTITY
#       display-name: "Mobs Killed"
#       entities:
#         - CREEPER
#         - ZOMBIE
#         - SKELETON
#       sync-on-join: false
#       sync-on-quit: true
#       sync-periodically: true
#
#   Each entry creates its own table:
#     deaths              → pss_stat_deaths
#     mine_block_DIAMOND_ORE → pss_stat_mine_block_diamond_ore
#     kill_entity_CREEPER    → pss_stat_kill_entity_creeper
#
# ============================================================
statistics:

  # --- Simple untyped stats ---
  deaths:
    enabled: true
    statistic: DEATHS
    display-name: "Deaths"
    sync-on-join: true
    sync-on-quit: true
    sync-periodically: true

  playtime:
    enabled: true
    statistic: PLAY_ONE_MINUTE
    display-name: "Playtime (ticks)"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true

  damage_dealt:
    enabled: true
    statistic: DAMAGE_DEALT
    display-name: "Damage Dealt"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true

  damage_taken:
    enabled: true
    statistic: DAMAGE_TAKEN
    display-name: "Damage Taken"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true

  walk_distance:
    enabled: true
    statistic: WALK_ONE_CM
    display-name: "Walk Distance (cm)"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true

  # --- Per-material stats ---
  mine_block:
    enabled: true
    statistic: MINE_BLOCK
    display-name: "Blocks Mined"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: false
    materials:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - COAL_ORE
      - DEEPSLATE_COAL_ORE

  # --- Custom stats (minecraft:custom namespace) ---
  open_chest:
    enabled: true
    statistic: CUSTOM
    custom_key: open_chest
    display-name: "Geöffnete Truhen"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: true

  # --- Per-entity stats ---
  kill_entity:
    enabled: true
    statistic: KILL_ENTITY
    display-name: "Entities Killed"
    sync-on-join: false
    sync-on-quit: true
    sync-periodically: false
    entities:
      # Overworld - haeufig
      - ZOMBIE
      - ZOMBIE_VILLAGER
      - DROWNED
      - HUSK
      - SKELETON
      - STRAY
      - BOGGED
      - CREEPER
      - SPIDER
      - CAVE_SPIDER
      - SLIME
      - SILVERFISH
      - ENDERMITE
      - PHANTOM
      - WITCH
      # Overworld - Illager
      - PILLAGER
      - VINDICATOR
      - EVOKER
      - RAVAGER
      - VEX
      # Overworld - Wasser
      - ELDER_GUARDIAN
      - GUARDIAN
      # Overworld - sonstige
      - SHULKER
      # End
      - ENDERMAN
      # Nether
      - BLAZE
      - WITHER_SKELETON
      - ZOMBIFIED_PIGLIN
      - PIGLIN
      - PIGLIN_BRUTE
      - HOGLIN
      - ZOGLIN
      - GHAST
      - MAGMA_CUBE
      # Bosse
      - WITHER
      - ENDER_DRAGON
      # 1.21+
      - BREEZE